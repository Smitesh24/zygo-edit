      <script>
        const tl = gsap.timeline({ paused: true });
        const W = 540, H = 940, K = W / 960;
        function pose(s, x, y) {
          let tx = W / 2 - s * x * K, ty = H / 2 - s * y * K;
          tx = Math.min(0, Math.max(W - s * W, tx));
          ty = Math.min(0, Math.max(H - s * H, ty));
          return { scale: s, x: tx, y: ty };
        }
        tl.fromTo("#hk-glow", { x: 0, scale: 0.9 }, { x: -160, scale: 1.1, duration: 12, ease: "sine.inOut" }, 0);
        tl.fromTo("#hk-brand", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
        tl.fromTo("#hk-live", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.25);
        tl.fromTo("#hk-rec", { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: "none", repeat: 15, yoyo: true }, 0.3);
        // device
        tl.fromTo("#hk-dev", { y: 160, opacity: 0, rotation: 4 }, { y: 0, opacity: 1, rotation: 0, duration: 0.8, ease: "power4.out" }, 0.0);
        tl.fromTo("#hk-tag-u", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 0.45);
        tl.set("#hk-tag-l", { opacity: 0 }, 0);
        tl.to("#hk-tag-u", { opacity: 0, duration: 0.15 }, 4.1);
        tl.fromTo("#hk-tag-l", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 4.15);
        tl.to("#hk-tag-l", { opacity: 0, duration: 0.15 }, 6.45);
        tl.to("#hk-tag-u", { opacity: 1, duration: 0.3 }, 6.5);
        // camera: hard cuts with a punch per beat
        tl.set("#hk-cam", pose(1.0, 480, 835), 0);
        tl.set("#hk-cam", pose(1.32, 480, 520), 1.05);
        tl.set("#hk-cam", pose(1.15, 470, 560), 2.05);
        tl.set("#hk-cam", pose(1.2, 480, 1250), 4.15);
        tl.set("#hk-cam", pose(1.15, 480, 900), 6.5);
        [1.05, 2.05, 4.15, 6.5].forEach((t) => {
          tl.fromTo("#hk-dev", { scale: 1.05 }, { scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t);
        });
        // beats: word in from below, out upward
        const beats = [[1, 0.3, 2.0], [2, 2.0, 4.1], [3, 4.15, 6.45], [4, 6.5, 8.45]];
        beats.forEach(([n, a, b]) => {
          tl.set(`#hk-b${n}`, { opacity: 0 }, 0);
          tl.set(`#hk-b${n}`, { opacity: 1 }, a);
          tl.set(`#hk-b${n}`, { opacity: 0 }, b);
          tl.fromTo(`#hk-b${n} .hk-k`, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, a);
          tl.fromTo(`#hk-w${n}`, { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, a);
          tl.fromTo(`#hk-a${n}`, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, a + 0.15);
          tl.to(`#hk-w${n}`, { yPercent: -110, duration: 0.3, ease: "power3.in" }, b - 0.3);
          tl.to(`#hk-b${n} .hk-k`, { opacity: 0, duration: 0.2 }, b - 0.25);
          tl.to(`#hk-a${n}`, { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, b - 0.3);
        });
        // beat assets
        tl.fromTo("#hk-laser", { y: 0 }, { y: 104, duration: 0.55, ease: "sine.inOut", repeat: 2, yoyo: true }, 0.4);
        tl.fromTo("#hk-c-inr", { rotationY: 0 }, { rotationY: 360, duration: 0.9, ease: "power2.inOut" }, 2.3);
        tl.fromTo("#hk-c-usdc", { scale: 0.5 }, { scale: 1, duration: 0.6, ease: "back.out(2.5)" }, 2.55);
        tl.fromTo("#hk-track", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 4.35);
        tl.fromTo("#hk-mini", { x: 0 }, { x: 410, duration: 1.1, ease: "power2.inOut" }, 4.7);
        tl.fromTo("#hk-seal", { scale: 0.3, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.2)" }, 6.65);
        tl.fromTo("#hk-rays", { opacity: 0, scale: 0.6, transformOrigin: "85px 85px" }, { opacity: 1, scale: 1.1, duration: 0.5, ease: "power2.out" }, 6.8);
        // exit to the logo lock-up ("This is Zygo." @8.6)
        tl.to("#hk-dev", { x: 700, rotation: 6, opacity: 0, duration: 0.55, ease: "power3.in" }, 8.3);
        tl.to("#hk-tag-u", { opacity: 0, duration: 0.2 }, 8.3);
        tl.to("#hk-brand, #hk-live", { opacity: 0, duration: 0.3 }, 8.35);
        tl.fromTo("#hk-endlogo", { scale: 0.3, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(1.9)" }, 8.6);
        tl.fromTo("#hk-endword", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 8.8);
        tl.fromTo("#hk-t1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.6);
        tl.fromTo("#hk-t2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.45);
        window.__timelines["hook"] = tl;
      </script>
