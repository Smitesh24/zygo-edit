<!doctype html>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#ou-glow", { scale: 0.8, opacity: 0.5 }, { scale: 1.1, opacity: 1, duration: 9.6, ease: "sine.out" }, 0);
        tl.fromTo("#ou-cards", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.1, ease: "power4.inOut" }, 0.2);
        tl.fromTo("#ou-cards-img", { scale: 1.2, yPercent: 4 }, { scale: 1.02, yPercent: 0, duration: 9.4, ease: "power1.out" }, 0.2);
        // VO outro @0.6: "Zygo." 0.64 / "Earn globally. Pay locally." ~1.3
        tl.fromTo("#ou-logo", { scale: 0.4, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.9, ease: "back.out(1.8)" }, 0.5);
        tl.fromTo("#ou-word", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.8);
        tl.fromTo("#ou-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.inOut" }, 1.0);
        tl.fromTo("#ou-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "power4.out" }, 1.25);
        tl.fromTo("#ou-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "power4.out" }, 1.95);
        tl.fromTo("#ou-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 3.0);
        tl.fromTo("#ou-contacts", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 3.6);
        window.__timelines["outro"] = tl;
      </script>
