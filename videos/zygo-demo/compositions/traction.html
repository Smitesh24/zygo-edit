      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#tr-glow", { scale: 0.9, x: 60 }, { scale: 1.15, x: -60, duration: 21.6, ease: "sine.inOut" }, 0);
        tl.fromTo("#tr-hdr", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
        tl.fromTo("#tr-hrule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.inOut" }, 0.15);
        // traction-1 @0.4: "And it's already live." 0.43
        tl.fromTo("#tr-h1", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "power4.out" }, 0.4);
        tl.fromTo("#tr-stats", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 1.2);

        function counter(sel, target, at, fmt, dur) {
          const el = document.querySelector(sel);
          const state = { v: 0 };
          tl.to(state, {
            v: target,
            duration: dur,
            ease: "power3.out",
            onUpdate: () => {
              el.textContent = fmt(Math.round(state.v));
            },
          }, at);
          tl.fromTo(sel, { scale: 0.72, opacity: 0 }, { scale: 1, opacity: 1, duration: dur, ease: "power3.out" }, at);
        }
        // "A hundred and fifty beta users" 1.85 / "$120K ... four weeks" 4.11 / "ten liquidity providers" 11.42
        counter("#tr-n1", 150, 1.8, (v) => String(v), 1.3);
        counter("#tr-n2", 120, 4.05, (v) => "$" + v + "K", 1.5);
        counter("#tr-n3", 10, 11.38, (v) => String(v), 0.9);
        // corridors 7.62
        tl.fromTo("#tr-corr-k", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 7.5);
        tl.fromTo("#tr-chip1", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 7.85);
        tl.fromTo("#tr-chip2", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 8.9);
        tl.fromTo("#tr-map", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.7);
        tl.fromTo("#tr-l1", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 7.85);
        tl.fromTo("#tr-l2", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 8.9);
        tl.fromTo("#tr-d1", { x: 0, opacity: 0 }, { x: 240, opacity: 1, duration: 1.2, ease: "power1.inOut", repeat: 3, repeatDelay: 0.5 }, 8.1);
        tl.fromTo("#tr-d2", { x: 0, opacity: 0 }, { x: -196, opacity: 1, duration: 1.2, ease: "power1.inOut", repeat: 3, repeatDelay: 0.5 }, 9.1);
        // traction-2 @14.2: "Payout API" 14.24 / "QR Payments API" 17.01
        tl.fromTo("#tr-scale-k", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 13.9);
        tl.fromTo("#tr-a1", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 14.2);
        tl.fromTo("#tr-a2", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 16.95);
        tl.to("#tr-wrap", { opacity: 0, y: -30, duration: 0.5, ease: "power2.in" }, 21.05);
        window.__timelines["traction"] = tl;
