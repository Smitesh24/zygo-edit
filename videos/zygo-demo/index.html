<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Zygo.cash — Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f3f2f2;
      }
      #main-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3f2f2;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="main-root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div
        id="sc-title"
        class="scene clip"
        data-composition-id="title"
        data-composition-src="compositions/title.html"
        data-start="0"
        data-duration="12"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio id="vo-title-1" src="assets/vo/title-1.wav" data-start="1.2" data-duration="2.56" data-track-index="20" data-volume="1"></audio>
      <audio id="vo-title-2" src="assets/vo/title-2.wav" data-start="4.5" data-duration="6.38" data-track-index="20" data-volume="1"></audio>
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="12" data-track-index="30" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
