<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Zygo.cash — Demo</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f3f2f2;
      }
      #main-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3f2f2;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .wipe {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wipe-logo {
        display: block;
        width: 150px;
        height: 150px;
        border-radius: 34px;
        background: url("assets/brand/zygo-logo.jpg") center / cover no-repeat;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="main-root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">
      {{HOSTS}}

      {{WIPES}}

      {{VO}}
      {{MUSIC}}
      {{SFX}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set(".wipe", { xPercent: 101 }, 0);
      {{WIPE_JS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
